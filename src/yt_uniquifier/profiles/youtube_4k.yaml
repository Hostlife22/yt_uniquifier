name: youtube_4k
description: >-
  YouTube 4K (3840x2160 16:9) re-encode with soft micro-transforms.
  Target loudness -14 LUFS (YouTube spec).  Crops to 16:9 cover so
  letterboxed/vertical sources land at full canvas.
transforms:
  - id: video.fit_aspect
    enabled: true
    params:
      target_aspect: "16:9"
      mode: crop
      allow_upscale: true
      target_width: 3840
      target_height: 2160
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.015, rng_seed: 42}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.006, contrast: 1.01, gamma: 0.998, saturation: 1.015}
  - id: video.noise
    enabled: true
    params: {strength: 2}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.0004, tempo: 1.0}
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed: 42
