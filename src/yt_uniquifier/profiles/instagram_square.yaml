name: instagram_square
description: >-
  Instagram square feed (1080x1080 1:1) with blurred-background pad so
  landscape sources retain context above and below the framed subject.
  -16 LUFS (Instagram target).
transforms:
  - id: video.fit_aspect
    enabled: true
    params:
      target_aspect: "1:1"
      mode: pad_blur
      allow_upscale: true
      blur_sigma: 22.0
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.02, rng_seed: 42}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.01, contrast: 1.018, gamma: 0.996, saturation: 1.025}
  - id: video.noise
    enabled: true
    params: {strength: 3}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.0008, tempo: 1.0}
  - id: audio.eq
    enabled: true
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -16.0
seed: 42
