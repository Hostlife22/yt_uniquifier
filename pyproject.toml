[project]
name = "yt-uniquifier"
version = "1.0.0"
description = "Production-grade re-encoder with controlled micro-transforms for owned/licensed video content."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "yt-uniquifier contributors" }]
keywords = ["video", "ffmpeg", "youtube", "re-encode"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "typer~=0.12",
    "pydantic~=2.7",
    "rich~=13.7",
    "pyyaml~=6.0",
    "imagehash~=4.3",
    # A9 (v0.5.5): bump above CVE-2024-28219 (heap buffer overflow in
    # _imagingcms) which affected Pillow 10.3.0. We only use Pillow via
    # imagehash for perceptual hashing, but the pin should not allow the
    # vulnerable point release on fresh installs.
    "Pillow>=10.3.1,<11",
    "structlog~=24.1",
    "jinja2~=3.1",
]

[project.optional-dependencies]
gui = [
    "PyQt6~=6.7",
    "PyQt6-WebEngine~=6.7",   # v0.5.2 — embedded QA HTML viewer (graceful fallback if missing)
]
gui-charts = ["PyQt6-Charts~=6.7"]   # v0.5.1 — nicer calibrate convergence chart (optional)
qa  = ["pyacoustid~=1.3"]
# v0.8.0 R3 — PySceneDetect for content-aware segment boundary mode. Opt-in
# because (a) the OpenCV runtime PySceneDetect needs is ~40 MB even in the
# headless build, and (b) the keyframe-aligned default works fine for most
# users. Scene mode is selected per-profile via ``segmentation.mode:
# scene`` — see ``docs/profiles.md`` and ``core/scene_detect.py``. We pin
# the headless OpenCV explicitly because PySceneDetect's bare wheel does
# not declare it as a hard dep (the project expects users to choose
# headed vs headless themselves).
scene = ["scenedetect~=0.6.6", "opencv-python-headless~=4.10"]
# v0.8.0 R4 — SSCD (Self-Supervised Copy Detection) ML metric. Strictly
# opt-in because the torch runtime is ~250 MB on CPU and ~1 GB with CUDA
# wheels. The model itself (~80 MB torchscript) is lazy-downloaded on
# first run, NOT bundled in the wheel. Users invoke via `--sscd` on
# `yt-uniq qa` or `compute_sscd=True` on the build_report API.
ml  = ["torch>=2.1,<3", "torchvision>=0.16,<1"]
# v0.9.0 R4 / F13 — headless web UI for NAS / Docker deployments.
# httpx is pulled by fastapi's TestClient too, so unit tests can run
# in-process against the route handlers without binding a socket.
web = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.30",
    "python-multipart~=0.0.9",
    "httpx~=0.27",
    # v1.1.0 Task 15: /metrics endpoint — Prometheus text format.
    "prometheus-client~=0.21",
    # v1.1.0 Task 16: per-IP and per-principal request rate limiting.
    "slowapi~=0.1.9",
]
# v0.9.0 R6 — mkdocs-material site. Dev-only; users do not
# install this. CI builds with --strict and deploys via the
# .github/workflows/docs.yml pipeline on tag push.
docs = [
    "mkdocs-material~=9.5",
    "pymdown-extensions~=10.9",
]
dev = [
    "pytest~=8.2",
    "pytest-cov~=5.0",
    "pytest-qt~=4.4",         # v0.5.0 — PyQt6 widget testing fixtures
    # v0.7.0 R8 — hard per-test cap so a stalled real-ffmpeg fixture
    # or a leaked daemon thread can't wedge the CI matrix for an hour.
    # See [tool.pytest.ini_options]::timeout in this file.
    "pytest-timeout~=2.3",
    "ruff~=0.5",
    "mypy~=1.10",
    "types-PyYAML~=6.0",
]

[project.scripts]
yt-uniq = "yt_uniquifier.cli.app:app"
yt-uniq-gui = "yt_uniquifier.gui.app_pyqt:main"
# v0.9.0 R4 / F13 — headless FastAPI server. Requires `[web]` extra.
yt-uniq-web = "yt_uniquifier.web.cli:main"

# v0.8.0 R1 — third-party transform plugins register here. A plugin package
# advertises an entry point whose value is an import path to a module that
# calls ``yt_uniquifier.core.transforms.register(TransformSpec(...))`` at
# import time. See ``docs/plugins.md`` for a worked example. The stub below
# is documentation, not a real entry point — uncomment in your own package.
#
# [project.entry-points."yt_uniquifier.transforms"]
# my_transform = "my_pkg.my_transform"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_uniquifier"]

[tool.hatch.build.targets.wheel.shared-data]
"src/yt_uniquifier/profiles" = "yt_uniquifier/profiles"
"src/yt_uniquifier/core/qa/templates" = "yt_uniquifier/core/qa/templates"
# v0.9.0 R1 / F9 — bootstrap marketplace catalog shipped in the wheel
# so a fresh install can list community profiles offline. Network
# fetch overrides this on first run; see core/profile_marketplace.py.
"src/yt_uniquifier/marketplace" = "yt_uniquifier/marketplace"
# v0.9.0 R4 / F13 — web UI templates + static assets shipped in the
# wheel so `yt-uniq-web` works straight from a pip install (no
# external asset directory hunt).
"src/yt_uniquifier/web/templates" = "yt_uniquifier/web/templates"
"src/yt_uniquifier/web/static" = "yt_uniquifier/web/static"

[tool.hatch.build]
include = [
    "src/yt_uniquifier/**/*.py",
    "src/yt_uniquifier/profiles/*.yaml",
    "src/yt_uniquifier/core/qa/templates/*.j2",
    "src/yt_uniquifier/marketplace/*.json",
    "src/yt_uniquifier/web/templates/*.html",
    "src/yt_uniquifier/web/static/*.js",
    "src/yt_uniquifier/web/static/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# typer.Argument/Option as defaults is the idiomatic pattern.
"src/yt_uniquifier/cli/*.py" = ["B008"]
"tools/*.py" = ["B008"]
# v0.9.0 R4 — FastAPI ``Depends(security)`` as a default is the
# documented idiom; suppressing B008 here matches our cli/ rule.
"src/yt_uniquifier/web/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that invoke real ffmpeg",
    "smoke: minimal CI sanity tests",
    "visual: GUI screenshot regression (linux-offscreen only)",
    "ml: tests that require the [ml] extra (torch + torchvision)",
]
# v0.7.0 R8 — global per-test cap via pytest-timeout. Three minutes is
# ~3× the slowest legitimate test (GUI run e2e at ~180 s). Anything
# that hits this is genuinely wedged — a hung subprocess, a deadlocked
# QThread, a SIGSTOP'd ffmpeg whose SIGCONT was lost in a CI sandbox —
# and we want the matrix to fail fast and surface a useful traceback,
# not block PR feedback for an hour. The ``thread`` method works with
# subprocess.communicate (signal method would only fire between Python
# opcodes, which the GIL-released communicate() never returns to).
timeout = 180
timeout_method = "thread"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# v0.9.0 R4 — the FastAPI web shell uses `app: Any` so the route
# modules can decorate without pulling fastapi into a strict-mode
# import graph. That produces ``untyped-decorator`` noise under
# --strict. The web layer is intentionally a thin shell over typed
# core/ — we relax the decorator check only inside web/.
[[tool.mypy.overrides]]
module = "yt_uniquifier.web.routes.*"
disable_error_code = ["untyped-decorator", "no-any-return"]
