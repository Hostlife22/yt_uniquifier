name: cid_aware
description: |
  Calibrated for Content ID divergence on owned / licensed content. Each
  run randomizes within safe bounds (variability for batch uploads of N
  variants). Visually clean — no mirror, no speed change.

  v0.3.1: pitch bumped 1.012 → 1.04 (~70 cents, past CID audio threshold)
  via the formant-preserving rubberband filter (voice stays natural).
  Adds loudnorm target jitter (±1.5 LUFS) and compand dynamic-range jitter
  to break audio-envelope fingerprinting.

  v0.3.2: pitch bumped 1.04 → 1.06 (Smitelli 2010 documented ±5% as the CID
  match boundary — 1.04 was inside the match zone). Adds audio.haas_stereo
  for mono-compatible cross-channel phase shift.
transforms:
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.04}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.015, contrast: 1.022, gamma: 0.99, saturation: 1.04}
  - id: video.noise
    enabled: true
    params: {strength: 5}
  - id: audio.pitch_tempo
    enabled: true
    # rubberband preserves formants. 1.06 is just past Smitelli's ±5%
    # match-threshold; randomize_within keeps the lower bound at 1.055.
    params: {pitch: 1.06, randomize_within: 0.005, method: rubberband}
  - id: audio.eq
    enabled: true
    params: {randomize_bands: true}
  - id: audio.haas_stereo
    enabled: true
    # 15 ms is inside the Haas fusion threshold — perceived as one source
    # in mono; widens stereo image slightly. Breaks cross-channel phase
    # relationship that audio fingerprinting relies on.
    params: {delay_ms: 15.0, randomize_within_ms: 4.0}
  - id: audio.resample
    enabled: true
    params: {intermediate_sr: 47999}
  - id: audio.compand
    enabled: true
    params: {threshold_db: -20.0, ratio: 2.5, randomize_within: true}
  - id: audio.loudnorm
    enabled: true
    # ±1.5 LUFS jitter per run; loudness footprint stops being a stable signal.
    params: {target_jitter_lufs: 1.5}
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed_strategy: per_run
