name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg + Qt6 system libs (Linux)
        # PyQt6 import (via pytest-qt) loads libEGL.so.1 even under
        # QT_QPA_PLATFORM=offscreen — Ubuntu runners don't ship it.
        # The xcb-* libs are needed by Qt's xcb platform plugin which
        # pytest-qt loads on init regardless of offscreen mode.
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_get_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo env DEBIAN_FRONTEND=noninteractive \
                timeout --kill-after=10s 120s apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                -o DPkg::Lock::Timeout=60 \
                "$@"; then
                return 0
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "apt-get failed after ${attempt} attempts" >&2
                return 1
              fi

              echo "apt-get attempt ${attempt} failed; retrying" >&2
              sudo env DEBIAN_FRONTEND=noninteractive \
                timeout --kill-after=5s 30s dpkg --configure -a || true
              sleep "$((attempt * 5))"
            done
          }

          apt_get_with_retry update
          apt_get_with_retry install -y --no-install-recommends ffmpeg \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        # Chocolatey is pre-installed on windows-latest runners.
        # The ffmpeg package puts ffmpeg.exe + ffprobe.exe on PATH.
        # Added in v0.6.0 — exercises the cross-platform plan_hash
        # (`mode="json"` path normalisation) and lockfile (cross-
        # platform `os.kill(pid, 0)` liveness probe) on a real
        # Windows host instead of trusting the unit-test mocks.
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install package
        # v1.0.1 Task 7: prefer the pinned-and-hashed dependency closure
        # in ``requirements-lock.txt`` so every CI run installs the same
        # versions (and verifies the wheel hashes). Fall back to the
        # pyproject.toml ranges only if the lockfile is missing — that
        # keeps the workflow green during the brief window between a
        # new dependency landing in pyproject and the next ``make lock``.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            echo "Installing pinned closure from requirements-lock.txt"
            pip install --require-hashes -r requirements-lock.txt
            pip install -e ".[dev,gui]" --no-deps
          else
            echo "requirements-lock.txt missing — falling back to ranges"
            pip install -e ".[dev,gui]"
          fi

      - name: Ruff check
        run: ruff check .

      # v0.7.0 R8 (revised v1.2.0 Task 26) — split fast vs. integration
      # tests.  The fast lane (unit + gui + smoke) runs on every matrix
      # cell (3 OS × 2 Py) so PR feedback stays under ~2 min.
      #
      # The slow lane (real-ffmpeg integration) now runs on EVERY cell.
      # Pre-v1.2 it was ubuntu+3.12 only on the assumption that
      # transform/encoder paths were platform-agnostic at the Python
      # level — but the v0.6.0 plan_hash mode="json" fix and the
      # cross-platform lockfile liveness probe were both regressions
      # the single-cell matrix missed.  AV1 detection (Task 22) and
      # VideoToolbox probing in particular need real macOS hardware to
      # exercise; Windows surfaces atomic-rename and path-separator
      # bugs that mocks can't.  The 180 s per-test cap from
      # pyproject.toml caps wall-clock at 20 × 180 s = 60 min worst
      # case per cell.
      - name: Pytest (fast — unit + gui + smoke)
        env:
          # Headless Qt: required for ubuntu-latest (no X display) and
          # for windows-latest under the GitHub Actions display agent;
          # harmless on macOS.
          QT_QPA_PLATFORM: offscreen
        # ``visual`` is excluded per its own module docstring — PNG
        # baselines diverge across macOS/Linux/Wayland font renderers
        # and are meant to be regenerated locally with
        # ``UPDATE_VISUAL_BASELINES=1`` on the canonical host.
        run: pytest -q -m "not integration and not visual"

      - name: Pytest (integration — real ffmpeg)
        # v1.2.0 Task 26 — promoted from ubuntu-3.12-only to all 6 cells.
        # Each integration test starts with ``@needs_ffmpeg`` so a missing
        # codec on a runner skips cleanly rather than failing.  The
        # 15 min job-level timeout caps the worst-case wall-clock; the
        # 180 s per-test cap from pyproject keeps individual tests honest.
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -m integration

      # v1.0.0 R3 — SemVer-gate on `core/` coverage. Runs once
      # (ubuntu-latest + 3.12) because line/branch coverage is
      # platform-independent and adding the gate to every matrix
      # cell would only burn CI minutes without surfacing new
      # signal. Branch coverage is enabled in .coveragerc so the
      # number reflects actual conditional-path exercise (not just
      # statement hits); the 80% floor accommodates that stricter
      # measure while the master-plan target (85% statement-only)
      # is already met. Ratchet target: 85% under branch=true by
      # v1.1, tracked in `docs/api-contracts.md` follow-ups.
      - name: Pytest (coverage gate — core/ only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q -m "not integration and not visual" \
            --cov=yt_uniquifier.core \
            --cov-report=term \
            --cov-fail-under=80
