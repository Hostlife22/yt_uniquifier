name: cid_aggressive
description: |
  Legacy experimental maximum-change profile retained for saved-job compatibility.
  It intentionally alters motion, timing, stereo image and audio texture and is not
  a production quality default. Use only with owned/licensed content and mandatory
  visual/listening QA; external rights-system behavior is not predicted.
transforms:
  - id: video.crop_resize
    enabled: true
    # v0.4.0: 0.07→0.09 — slightly stronger than cid_aware (0.06).
    params: {max_strength: 0.09}
  - id: video.color_eq
    enabled: true
    # Strong photometric change; no corpus-backed VMAF band is claimed.
    params: {brightness: 0.035, contrast: 1.04, gamma: 0.99, saturation: 1.07}
  - id: video.noise
    enabled: true
    # v0.4.0: 7→10.
    params: {strength: 10}
  - id: video.subpixel_sharpen
    enabled: true
    # Strong sharpen combined with noise can produce ringing and bitrate growth.
    params: {luma_amount: 0.10, radius: 5}
  - id: video.temporal_jitter
    enabled: true
    # Intentionally drops/replaces frames and may visibly damage motion.
    params: {blackout_prob: 0.050, drop_prob: 0.040, blackout_blur: true}
  - id: video.speed
    enabled: true
    params: {rate: 0.99}
  - id: audio.pitch_tempo
    enabled: true
    # Large pitch change; Rubber Band reduces but does not eliminate artifacts.
    params: {pitch: 1.08, tempo: 0.99, randomize_within: 0.01, method: rubberband}
  - id: audio.eq
    enabled: true
    # Randomized EQ can materially change dialogue and music balance.
    params:
      bands: [[110.0, -0.9], [3800.0, 0.6]]
      randomize_bands: true
      jitter_db: 2.0
  - id: audio.haas_stereo
    enabled: true
    # Wider delay on aggressive — audible as stereo widening but still
    # within psychoacoustic fusion (single-source perception).
    params: {delay_ms: 25.0, randomize_within_ms: 8.0}
  - id: audio.resample
    # v0.4.0: tiny intermediate-SR shift is below chromaprint quantization.
    # Disabled; for audible spectrum shift use audio.pitch_tempo.
    enabled: false
    params: {intermediate_sr: 47997}
  - id: audio.compand
    enabled: true
    params: {threshold_db: -18.0, ratio: 3.0, randomize_within: true}
  - id: audio.spectral_smear
    enabled: true
    params: {intensity: 0.025}
  - id: audio.reverb
    enabled: true
    params: {intensity: 0.10, style: small_room}
  - id: audio.noise_overlay
    enabled: true
    # -12 dB noise is clearly audible and unsuitable for quality-first delivery.
    params: {noise_db: -12.0, color: pink, randomize_within_db: 2.0}
  - id: audio.loudnorm
    enabled: true
    params: {target_jitter_lufs: 2.0}
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed_strategy: divergent
