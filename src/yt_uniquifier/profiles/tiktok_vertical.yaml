name: tiktok_vertical
description: >-
  TikTok / Reels-style vertical (1080x1920 9:16) — crop-center.
  -16 LUFS (TikTok target).  Slightly stronger noise + pitch shift than
  YouTube profiles because TikTok's de-dup is more aggressive.
transforms:
  - id: video.fit_aspect
    enabled: true
    params:
      target_aspect: "9:16"
      mode: crop
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.025, rng_seed: 42}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.012, contrast: 1.02, gamma: 0.995, saturation: 1.03}
  - id: video.noise
    enabled: true
    params: {strength: 4}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.001, tempo: 1.0}
  - id: audio.eq
    enabled: true
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -16.0
seed: 42
