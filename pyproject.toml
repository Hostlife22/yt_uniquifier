[project]
name = "yt-uniquifier"
version = "0.1.0a0"
description = "Production-grade re-encoder with controlled micro-transforms for owned/licensed video content."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "yt-uniquifier contributors" }]
keywords = ["video", "ffmpeg", "youtube", "re-encode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "typer~=0.12",
    "pydantic~=2.7",
    "rich~=13.7",
    "pyyaml~=6.0",
    "imagehash~=4.3",
    "Pillow~=10.3",
    "structlog~=24.1",
    "jinja2~=3.1",
]

[project.optional-dependencies]
gui = ["PyQt6~=6.7"]
qa  = ["pyacoustid~=1.3"]
dev = [
    "pytest~=8.2",
    "pytest-cov~=5.0",
    "ruff~=0.5",
    "mypy~=1.10",
]

[project.scripts]
yt-uniq = "yt_uniquifier.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_uniquifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# typer.Argument/Option as defaults is the idiomatic pattern.
"src/yt_uniquifier/cli/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that invoke real ffmpeg",
    "smoke: minimal CI sanity tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
