name: Release

# F1 R1 (v0.6.0): scaffolding for the desktop-binary release pipeline.
# F1 R4 (v1.0.0): Linux AppImage with bundled static ffmpeg + SHA256SUMS.
#
# Triggered on a `v*` tag push (e.g. `git tag v1.0.0 && git push --tags`),
# this workflow builds the PyInstaller bundle on Ubuntu / macOS / Windows,
# wraps the Linux bundle in an AppImage, computes SHA256SUMS, and uploads
# everything to a DRAFT GitHub Release. The draft must be reviewed and
# published manually so an accidental tag push doesn't ship binaries.
#
# Signing status as of v1.0.0:
#   - Linux AppImage: ✅ self-contained — no X.509 cert needed; verified
#                     via the SHA256SUMS file attached to the release.
#   - macOS .app.zip: ❌ UNSIGNED — Gatekeeper warns on first launch.
#                     See docs/install.md for the right-click → Open
#                     bypass. Signing deferred to a v1.0.x patch once
#                     APPLE_TEAM_ID / APPLE_DEV_ID_CERT secrets exist.
#   - Windows .zip:   ❌ UNSIGNED — SmartScreen warns. Same story —
#                     waiting on WIN_CODESIGN_PFX secret.
# See installers/README.md for the full list of secrets the signing
# rounds will consume.
#
# The CI workflow (.github/workflows/ci.yml) tests the source. This
# workflow tests the BUNDLE — that the existing pyinstaller spec
# actually produces a launchable artifact on every supported OS.

on:
  push:
    tags:
      - "v*.*.*"
  # Manual dispatch lets the maintainer test the complete build, SBOM,
  # checksum and signing pipeline without cutting a real tag. It uploads a
  # release-candidate artifact but never creates a GitHub Release.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: write   # softprops/action-gh-release draft creation
  id-token: write   # v1.1.0 Task 11: cosign keyless OIDC signing

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: yt-uniq-gui-Linux
            archive_cmd: tar -C dist -czf "$ARTIFACT.tar.gz" yt-uniq-gui
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: yt-uniq-gui-macOS
            # ditto preserves resource forks + the .app bundle structure
            # that `zip -r` mangles on macOS.
            archive_cmd: ditto -c -k --keepParent "dist/yt-uniq-gui.app" "$ARTIFACT.zip"
            archive_ext: zip
          - os: windows-latest
            artifact_name: yt-uniq-gui-Windows
            archive_ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Qt6 system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install package + PyInstaller
        # `[gui]` pulls PyQt6 + PyQt6-WebEngine which the spec hidden-imports.
        # PyInstaller is pinned to a version known to work with PyQt6 6.7+.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          pip install "pyinstaller>=6.6,<7"

      - name: Smoke-test the source before bundling
        # If the source can't import on this platform, bundling will
        # silently produce a broken artifact. Fail loud here instead.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import yt_uniquifier.gui.app_pyqt; print('GUI imports OK')"
          python -c "from yt_uniquifier.core.transforms import all_ids; print('transforms:', len(all_ids()))"

      - name: Build PyInstaller bundle
        run: python -m PyInstaller pyinstaller/yt-uniq-gui.spec --clean --noconfirm

      - name: Verify bundle artefact exists (macOS)
        if: runner.os == 'macOS'
        run: test -d dist/yt-uniq-gui.app

      - name: Verify bundle artefact exists (Linux)
        if: runner.os == 'Linux'
        run: |
          find dist/yt-uniq-gui -mindepth 1 -maxdepth 1 -print -quit

      - name: Verify bundle artefact exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -PathType Container "dist/yt-uniq-gui")) {
            throw "Windows release bundle directory was not created"
          }
          if (-not (Get-ChildItem "dist/yt-uniq-gui" | Select-Object -First 1)) {
            throw "Windows release bundle directory is empty"
          }

      - name: Ad-hoc codesign .app bundle (macOS)
        # v1.1.0 Task 8: ad-hoc signature stabilises the bundle across
        # macOS updates. Does NOT pass Gatekeeper on its own — users
        # still right-click → Open the first time per docs/install.md.
        # Full notarization remains a backlog item if an Apple Developer
        # Program account materialises.
        if: runner.os == 'macOS'
        run: |
          bash installers/macos/codesign-adhoc.sh dist/yt-uniq-gui.app

      - name: Verify embedded version (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          expected="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          actual="$(dist/yt-uniq-gui/yt-uniq-gui --version)"
          test "${actual}" = "${expected}"

      - name: Verify embedded version and signature (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          expected="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          actual="$(dist/yt-uniq-gui.app/Contents/MacOS/yt-uniq-gui --version)"
          test "${actual}" = "${expected}"
          codesign --verify --deep --strict --verbose=2 dist/yt-uniq-gui.app

      - name: Verify embedded package version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $metadata = Get-ChildItem "dist/yt-uniq-gui" -Recurse -Filter "METADATA" |
            Where-Object {
              Select-String -Path $_.FullName -Pattern '^Name: yt-uniquifier$' -Quiet
            } |
            Select-Object -First 1
          if (-not $metadata) {
            throw "Bundled yt-uniquifier package metadata was not found"
          }
          $versionLine = Get-Content $metadata.FullName |
            Where-Object { $_ -match '^Version: ' } |
            Select-Object -First 1
          $actual = ($versionLine -split ':', 2)[1].Trim()
          if ($actual -ne "$expected") {
            throw "Embedded version mismatch: expected $expected, got $actual"
          }

      - name: Package archive (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact_name }}
        run: ${{ matrix.archive_cmd }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact_name }}
        run: |
          $destination = "$env:ARTIFACT.zip"
          Compress-Archive -Path "dist/yt-uniq-gui" -DestinationPath $destination -Force
          if (-not (Test-Path -PathType Leaf $destination)) {
            throw "Windows release archive was not created: $destination"
          }
          Get-Item $destination | Format-List Name,Length

      - name: Upload artifact to workflow run
        # Always upload to workflow-level artifacts so a build failure
        # in a later step still leaves the bundle inspectable.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          retention-days: 14
          if-no-files-found: error

  appimage:
    # v1.0.0 R5 / F1 R4 — wrap the Linux PyInstaller bundle in an
    # AppImage with a bundled static ffmpeg so the result is portable
    # across glibc lines and does NOT require the user to apt-install
    # ffmpeg first. Runs after the matrix `build` job finishes so we
    # can reuse the Linux artefact instead of re-running PyInstaller.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: yt-uniq-gui-Linux
          path: _dl

      - name: Restore PyInstaller dist/ layout
        # The build job archived `dist/yt-uniq-gui/` as a tarball;
        # AppImageBuilder.yml expects to find it back at dist/.
        run: |
          mkdir -p dist
          tar -xzf _dl/yt-uniq-gui-Linux.tar.gz -C dist
          find dist/yt-uniq-gui -mindepth 1 -maxdepth 1 -print -quit

      - name: Fetch static ffmpeg (johnvansickle release)
        # AppImage must be portable across glibc versions, so the
        # apt-installed ffmpeg used elsewhere in CI is not suitable.
        # johnvansickle ships a fully static x86_64 build.
        run: |
          mkdir -p .perf_cache/ffmpeg-static
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C .perf_cache/ffmpeg-static
          .perf_cache/ffmpeg-static/ffmpeg -version | head -1
          .perf_cache/ffmpeg-static/ffprobe -version | head -1

      - name: Generate placeholder icon
        # The recipe references installers/linux/yt-uniq-gui.png. We
        # generate a 256×256 solid-color placeholder at CI time so the
        # repo doesn't carry a binary asset. Replace with a real icon
        # in a follow-up when art lands.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -size 256x256 xc:'#1e1e2e' \
            -font "DejaVu-Sans-Bold" -pointsize 96 -fill '#9fd3ff' \
            -gravity center -annotate +0+0 "YU" \
            installers/linux/yt-uniq-gui.png

      - name: Install appimage-builder
        run: |
          sudo apt-get install -y python3-pip libgdk-pixbuf-2.0-0 fakeroot \
            squashfs-tools zsync desktop-file-utils
          sudo pip3 install --break-system-packages "appimage-builder>=1.1"

      - name: Build AppImage
        run: |
          YT_UNIQUIFIER_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          export YT_UNIQUIFIER_VERSION
          appimage-builder --recipe installers/linux/AppImageBuilder.yml \
            --skip-test
          find . -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.AppImage.zsync' \) -print

      - name: Verify AppImage version and bundled tools
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          expected="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "${appimage}"
          chmod +x "${appimage}"
          actual="$("${appimage}" --version)"
          test "${actual}" = "${expected}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-uniq-gui-AppImage
          path: |
            *.AppImage
            *.AppImage.zsync
          retention-days: 14
          if-no-files-found: error

  release:
    # Always assemble and verify a complete release candidate. Only the final
    # publish step is tag-gated, so workflow_dispatch proves the supply-chain
    # path without creating a tag or draft release.
    needs: [build, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release write
      id-token: write   # v1.1.0 Task 11: cosign keyless OIDC token
    steps:
      - uses: actions/checkout@v7
        # v1.1.0 Task 10: cyclonedx-py needs pyproject.toml present at
        # the repo root to enumerate the declared dependency closure.
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artefacts into a single flat directory
        # The download step produces one subdir per artifact; the
        # release upload + SHA256SUMS step want a flat directory.
        run: |
          mkdir -p _release
          find artifacts -type f \
            \( -name 'yt-uniq-gui-*.zip' \
            -o -name 'yt-uniq-gui-*.tar.gz' \
            -o -name 'yt-uniq-gui*.AppImage' \
            -o -name 'yt-uniq-gui*.AppImage.zsync' \) \
            -exec cp {} _release/ \;
          test "$(find _release -maxdepth 1 -name 'yt-uniq-gui-Linux.tar.gz' | wc -l)" -eq 1
          test "$(find _release -maxdepth 1 -name 'yt-uniq-gui-macOS.zip' | wc -l)" -eq 1
          test "$(find _release -maxdepth 1 -name 'yt-uniq-gui-Windows.zip' | wc -l)" -eq 1
          test "$(find _release -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          ls -la _release/

      - name: Set up Python for SBOM
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM
        # v1.1.0 Task 10: enumerate the runtime + [gui] dependency
        # closure as a CycloneDX 1.5 JSON bundle. Users can verify
        # supply-chain provenance with `cyclonedx validate` or feed
        # the SBOM into Trivy / Grype / OSV-Scanner.
        run: |
          python -m pip install --upgrade pip
          # Install the package into the runner's Python so
          # cyclonedx-py's `environment` command sees the full
          # transitive closure. `--no-deps -e .` would miss runtime
          # deps; install with [gui] to mirror the .app bundle's
          # surface.
          pip install -e ".[gui]"
          pip install "cyclonedx-bom>=4.4,<5"
          cyclonedx-py environment \
            --of JSON \
            -o _release/sbom.cdx.json
          # Sanity: must be valid JSON with the cyclonedx schema marker.
          python -c "import json; \
                     d = json.load(open('_release/sbom.cdx.json')); \
                     assert d.get('bomFormat') == 'CycloneDX', d.get('bomFormat'); \
                     print('SBOM components:', len(d.get('components', [])))"

      - name: Generate and verify SHA256SUMS
        # Include the SBOM itself. The checksum manifest intentionally does not
        # list itself; cosign signs both it and every listed artifact below.
        run: |
          cd _release
          sha256sum yt-uniq-gui-* sbom.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        # v1.1.0 Task 11: cosign keyless signing via GitHub OIDC.
        # No long-lived keys — the workflow's id-token claim is what
        # Fulcio / Rekor verify against on `cosign verify-blob`.
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign release artifacts with cosign
        # One signed bundle per artifact (incl. SBOM and SHA256SUMS).
        # The .cosign.bundle file is self-describing (carries the
        # certificate + Rekor proof) so verification only needs the
        # public github.com/Hostlife22 identity regexp.
        run: |
          cd _release
          for asset_path in ./*; do
            asset="${asset_path#./}"
            # Skip already-generated bundles to keep re-runs idempotent.
            case "$asset" in
              *.cosign.bundle) continue ;;
            esac
            echo "Signing $asset…"
            cosign sign-blob --yes \
              --bundle "$asset.cosign.bundle" \
              "$asset"
          done
          find . -maxdepth 1 -type f -name '*.cosign.bundle' -print

      - name: Upload assembled release candidate
        uses: actions/upload-artifact@v7
        with:
          name: yt-uniq-release-candidate
          path: _release/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish DRAFT release
        # Draft so a human reviews before users see it. softprops is the
        # most-widely-used action for this; it accepts a glob of files
        # and attaches them to the release named after the tag.
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          name: "yt-uniquifier ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            _release/*
