name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg + Qt6 system libs (Linux)
        # PyQt6 import (via pytest-qt) loads libEGL.so.1 even under
        # QT_QPA_PLATFORM=offscreen — Ubuntu runners don't ship it.
        # The xcb-* libs are needed by Qt's xcb platform plugin which
        # pytest-qt loads on init regardless of offscreen mode.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        env:
          # Headless Qt — required for ubuntu-latest (no X display);
          # harmless on macOS runners.
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
