name: youtube_4k_av1
description: >-
  YouTube 4K AV1 (3840x2160 16:9) re-encode with soft micro-transforms.
  AV1 size, quality and speed depend on content and encoder; benchmark against an
  encode-only control first. The explicit 3840x2160 canvas may upscale lower-resolution
  sources but cannot restore detail; hardware paths require capability validation.
transforms:
  - id: video.fit_aspect
    enabled: true
    params:
      target_aspect: "16:9"
      mode: crop
      target_width: 3840
      target_height: 2160
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.015, rng_seed: 42}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.006, contrast: 1.01, gamma: 0.998, saturation: 1.015}
  - id: video.noise
    enabled: true
    params: {strength: 2}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.0004, tempo: 1.0}
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: av1
target_loudness_lufs: -14.0
seed: 42
