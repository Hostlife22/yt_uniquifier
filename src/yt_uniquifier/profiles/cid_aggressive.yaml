name: cid_aggressive
description: |
  Strong fingerprint shifts for content that tolerates more change. Adds a
  subtle chorus to audio and a -1% playback speed. video.mirror is NOT
  enabled here — opt in manually for B-roll / abstract content.
transforms:
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.07}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.02, contrast: 1.03, gamma: 0.99, saturation: 1.05}
  - id: video.noise
    enabled: true
    params: {strength: 7}
  - id: video.speed
    enabled: true
    params: {rate: 0.99}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.02, tempo: 0.99, randomize_within: 0.005}
  - id: audio.eq
    enabled: true
    params:
      bands: [[110.0, -0.9], [3800.0, 0.6]]
      randomize_bands: true
  - id: audio.resample
    enabled: true
    params: {intermediate_sr: 47997}
  - id: audio.spectral_smear
    enabled: true
    params: {intensity: 0.025}
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed_strategy: per_run
