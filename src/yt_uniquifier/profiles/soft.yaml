name: soft
description: Minimal changes. Highest quality, lowest uniqueness.
transforms:
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.015, rng_seed: 42}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.006, contrast: 1.01, gamma: 0.998, saturation: 1.015}
  - id: video.noise
    enabled: true
    params: {strength: 2}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.0004, tempo: 1.0}
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed: 42
