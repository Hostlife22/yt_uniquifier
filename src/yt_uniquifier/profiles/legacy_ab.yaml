name: legacy_ab
description: Frame-blend with a secondary B-video. Requires --b-video path. Equivalent of legacy AB-Video-Deduplicator behaviour as a native ffmpeg filter.
transforms:
  - id: video.blend_b
    enabled: true
    # b_video_path is required and is injected by the CLI via --b-video.
    params:
      opacity: 0.03
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed: 42
