name: cid_aggressive
description: |
  Strong fingerprint shifts for content that tolerates more change. Adds a
  subtle chorus to audio and a -1% playback speed. video.mirror is NOT
  enabled here — opt in manually for B-roll / abstract content.
transforms:
  - id: video.crop_resize
    enabled: true
    # v0.4.0: 0.07→0.09 — slightly stronger than cid_aware (0.06).
    params: {max_strength: 0.09}
  - id: video.color_eq
    enabled: true
    # v0.4.0: aggressive bumps — VMAF may dip to ~80 but pHash worst chunk
    # should clear 0.75.
    params: {brightness: 0.035, contrast: 1.04, gamma: 0.99, saturation: 1.07}
  - id: video.noise
    enabled: true
    # v0.4.0: 7→10.
    params: {strength: 10}
  - id: video.subpixel_sharpen
    enabled: true
    # v0.4.0: stronger than cid_aware (0.05) — still below visual threshold
    # per ITU-R BT.500 contrast sensitivity on natural content.
    params: {luma_amount: 0.10, radius: 5}
  - id: video.temporal_jitter
    enabled: true
    # Stronger jitter on aggressive — closer to Fojcik's reference 1/10 rate.
    params: {blackout_prob: 0.050, drop_prob: 0.040, blackout_blur: true}
  - id: video.speed
    enabled: true
    params: {rate: 0.99}
  - id: audio.pitch_tempo
    enabled: true
    # rubberband for natural voice. 1.08 = comfortable margin past Smitelli
    # ±5% match-zone (1.04–1.05). randomize_within keeps lower bound ≥ 1.07.
    params: {pitch: 1.08, tempo: 0.99, randomize_within: 0.01, method: rubberband}
  - id: audio.eq
    enabled: true
    # v0.4.0: jitter_db 0.2→2.0 — at the edge of chromaprint's robustness floor.
    params:
      bands: [[110.0, -0.9], [3800.0, 0.6]]
      randomize_bands: true
      jitter_db: 2.0
  - id: audio.haas_stereo
    enabled: true
    # Wider delay on aggressive — audible as stereo widening but still
    # within psychoacoustic fusion (single-source perception).
    params: {delay_ms: 25.0, randomize_within_ms: 8.0}
  - id: audio.resample
    # v0.4.0: tiny intermediate-SR shift is below chromaprint quantization.
    # Disabled; for audible spectrum shift use audio.pitch_tempo.
    enabled: false
    params: {intermediate_sr: 47997}
  - id: audio.compand
    enabled: true
    params: {threshold_db: -18.0, ratio: 3.0, randomize_within: true}
  - id: audio.spectral_smear
    enabled: true
    params: {intensity: 0.025}
  - id: audio.reverb
    enabled: true
    params: {intensity: 0.10, style: small_room}
  - id: audio.noise_overlay
    enabled: true
    # -12 dB ≈ 25 % amplitude mix — past Smitelli's "audible" threshold,
    # well below the 45 % destructive boundary. Pink noise = smoother spectrum.
    params: {noise_db: -12.0, color: pink, randomize_within_db: 2.0}
  - id: audio.loudnorm
    enabled: true
    params: {target_jitter_lufs: 2.0}
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed_strategy: divergent
