name: cid_aware
description: |
  Legacy experimental high-change profile retained for compatibility with saved
  jobs. Use only on owned or licensed content after visual/listening review.
  Similarity metrics are internal regression diagnostics, not a prediction of or
  guarantee about any external rights-management system.
transforms:
  - id: video.crop_resize
    enabled: true
    # Six-percent total-axis crop can remove important edge content.
    params: {max_strength: 0.06}
  - id: video.color_eq
    enabled: true
    # Stronger than the quality-first profiles; inspect highlights and skin tones.
    params: {brightness: 0.025, contrast: 1.022, gamma: 0.99, saturation: 1.06}
  - id: video.noise
    enabled: true
    # Raises bitrate and may amplify second-generation compression artifacts.
    params: {strength: 8}
  - id: video.subpixel_sharpen
    enabled: true
    # Noise plus sharpen can create ringing; preflight reports this combination.
    params: {luma_amount: 0.05, radius: 5}
  - id: video.temporal_jitter
    enabled: true
    # Intentionally alters frames and can create visible flashes or motion judder.
    params: {blackout_prob: 0.033, drop_prob: 0.020, blackout_blur: true}
  - id: audio.pitch_tempo
    enabled: true
    # Large pitch shift: review dialogue/music subjectively before delivery.
    params: {pitch: 1.06, randomize_within: 0.005, method: rubberband}
  - id: audio.eq
    enabled: true
    # Randomized EQ changes tonal balance; not suitable as a quality default.
    params: {randomize_bands: true, jitter_db: 1.5}
  - id: audio.haas_stereo
    enabled: true
    # Alters stereo phase and requires stereo input; verify mono compatibility.
    params: {delay_ms: 15.0, randomize_within_ms: 4.0}
  - id: audio.resample
    # v0.4.0: 48000→47999→48000 is 0.002 % — below chromaprint quantization.
    # Disabled as placebo; pitch + Haas + envelope jitter do the real work.
    enabled: false
    params: {intermediate_sr: 47999}
  - id: audio.compand
    enabled: true
    params: {threshold_db: -20.0, ratio: 2.5, randomize_within: true}
  - id: audio.loudnorm
    enabled: true
    # Per-run target variation can deviate from platform loudness guidance.
    params: {target_jitter_lufs: 1.5}
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed_strategy: divergent
