name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg + Qt6 system libs (Linux)
        # PyQt6 import (via pytest-qt) loads libEGL.so.1 even under
        # QT_QPA_PLATFORM=offscreen — Ubuntu runners don't ship it.
        # The xcb-* libs are needed by Qt's xcb platform plugin which
        # pytest-qt loads on init regardless of offscreen mode.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        # Chocolatey is pre-installed on windows-latest runners.
        # The ffmpeg package puts ffmpeg.exe + ffprobe.exe on PATH.
        # Added in v0.6.0 — exercises the cross-platform plan_hash
        # (`mode="json"` path normalisation) and lockfile (cross-
        # platform `os.kill(pid, 0)` liveness probe) on a real
        # Windows host instead of trusting the unit-test mocks.
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Ruff check
        run: ruff check .

      # v0.7.0 R8 — split fast vs. integration tests. The fast lane
      # (unit + gui + smoke) runs on every matrix cell (3 OS × 2 Py) so
      # PR feedback stays under ~2 min. The slow lane (real-ffmpeg
      # integration) runs only on ubuntu+3.12 — every transform and
      # encoder path it exercises is platform-agnostic at the Python
      # level, so the extra coverage from running it 6× was pure
      # wall-clock cost with no signal. The 180 s per-test cap from
      # pyproject.toml is the safety net against any future hang.
      - name: Pytest (fast — unit + gui + smoke)
        env:
          # Headless Qt: required for ubuntu-latest (no X display) and
          # for windows-latest under the GitHub Actions display agent;
          # harmless on macOS.
          QT_QPA_PLATFORM: offscreen
        # ``visual`` is excluded per its own module docstring — PNG
        # baselines diverge across macOS/Linux/Wayland font renderers
        # and are meant to be regenerated locally with
        # ``UPDATE_VISUAL_BASELINES=1`` on the canonical host.
        run: pytest -q -m "not integration and not visual"

      - name: Pytest (integration — real ffmpeg)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -m integration
