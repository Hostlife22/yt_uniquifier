# v1.1.0 Task 12 — multi-arch Docker image to ghcr.io.
#
# Triggered on the same v*.*.* tag push as release.yml so the GitHub
# Release page and the container registry move together. We use the
# native buildx multi-arch path so the resulting image works on:
#   * x86_64 (Intel/AMD64 servers)
#   * arm64  (M-series Macs, Raspberry Pi 5, AWS Graviton)
#
# The Dockerfile uses the official multi-arch Python/Debian base and installs
# Debian's architecture-matched FFmpeg package inside each platform leg.

name: Docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, SHA)"
        required: false
        default: "main"
      tag:
        description: "Image tag (defaults to git ref name)"
        required: false
        default: "edge"
      publish:
        description: "Publish/sign after smoke; false checks both architectures without changing GHCR"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write     # publish to ghcr.io
  id-token: write     # cosign keyless on the image too

jobs:
  smoke:
    name: Smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build, start, health-check, and process a real clip
        env:
          DOCKER_BUILD_SUMMARY: "false"
        run: tools/docker_multiarch_smoke.sh "${{ matrix.platform }}" "yt-uniquifier:smoke-${{ matrix.arch }}"

  buildx:
    needs: smoke
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        # Cross-arch emulation for the arm64 leg on an x86_64 runner.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        # The metadata-action plumbs the right OCI labels (source URL,
        # licenses, version) so anyone running `docker inspect` sees
        # the same info that GH renders on the package page.
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/yt-uniquifier
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=yt-uniquifier
            org.opencontainers.image.description=Headless web UI for re-encoding owned/licensed video with controlled micro-transforms.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance + SBOM attestation are produced and pushed
          # alongside the image so `docker buildx imagetools inspect`
          # surfaces the same supply-chain audit trail as the GH
          # Release artifacts.
          provenance: mode=max
          sbom: true
          # Reuse the already tested per-architecture layers. Separate scopes
          # prevent the two parallel smoke legs from overwriting each other.
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
            type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign published image (keyless OIDC)
        # Same approach as release.yml — no long-lived keys. The image
        # digest from build-push-action is what cosign signs so any
        # downstream retag still resolves to the verified digest.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # The metadata-action `tags` output is newline-separated. For
          # each tag, point cosign at the digest-pinned reference so
          # we don't sign a moving target.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing $tag@$DIGEST"
            cosign sign --yes "$tag@$DIGEST"
          done <<< "$TAGS"

      - name: Verify immutable image and retain supply-chain evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image_tag="${TAGS%%$'\n'*}"
          image_ref="${image_tag}@${DIGEST}"
          mkdir -p image-proof
          cosign verify --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${image_ref}" > image-proof/signature.json
          docker buildx imagetools inspect "${image_ref}" --raw > image-proof/index.json
          docker buildx imagetools inspect "${image_ref}" --format '{{json .SBOM}}' > image-proof/sbom.json
          docker buildx imagetools inspect "${image_ref}" --format '{{json .Provenance}}' > image-proof/provenance.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path("image-proof")
          index = json.loads((root / "index.json").read_text())
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in index["manifests"]
          }
          assert {("linux", "amd64"), ("linux", "arm64")} <= platforms
          expected_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          for name in ("sbom", "provenance"):
              evidence = json.loads((root / f"{name}.json").read_text())
              assert {"linux/amd64", "linux/arm64"} <= set(evidence), name
              for platform in ("linux/amd64", "linux/arm64"):
                  if name == "sbom":
                      assert evidence[platform]["SPDX"]["packages"], platform
                  else:
                      arguments = evidence[platform]["SLSA"]["buildDefinition"]["externalParameters"]["request"]["args"]
                      assert arguments["label:org.opencontainers.image.revision"] == expected_commit
          PY

      - name: Upload image verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-proof
          path: image-proof/
          if-no-files-found: error
