name: medium
description: >-
  Moderate authorized-derivative preset. More visible processing than soft;
  experimental until its quality bands are validated on licensed natural content.
transforms:
  - id: video.crop_resize
    enabled: true
    params: {max_strength: 0.025, rng_seed: 42}
  - id: video.color_eq
    enabled: true
    params: {brightness: 0.012, contrast: 1.018, gamma: 0.995, saturation: 1.03}
  - id: video.noise
    enabled: true
    params: {strength: 4}
  - id: audio.pitch_tempo
    enabled: true
    params: {pitch: 1.0008, tempo: 1.0}
  - id: audio.eq
    enabled: true
  - id: audio.loudnorm
    enabled: true
audio_tracks: first
keep_hdr: false
output_container: mp4
target_codec: h264
target_loudness_lufs: -14.0
seed: 42
