name: Mutation testing (weekly)

# v1.2.0 Task 27 — mutmut-driven mutation testing of core/.  Runs once
# a week (slow — full suite per surviving mutation).  The kill-rate
# floor is intentionally conservative for v1.2.0 (40%) so the workflow
# can ratchet upward in subsequent releases as the suite hardens.  The
# v1.3.0 target per the roadmap is 70%.

on:
  schedule:
    # Every Sunday at 02:00 UTC.  No business reason for that exact
    # time — just outside US/EU business hours so a long run doesn't
    # contend with on-demand CI traffic.
    - cron: "0 2 * * 0"
  workflow_dispatch:  # operators can re-trigger manually after a deps bump

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # full mutation pass on core/ can take 1-2h
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Run mutmut on core/
        env:
          QT_QPA_PLATFORM: offscreen
        # ``--paths-to-mutate`` restricts the mutation set to core/; the
        # CLI/GUI shells are intentionally excluded because they're
        # thin wrappers around core and mutations there mostly land in
        # untested glue.  Unit tests run with -m "not integration and
        # not visual" so the mutation pass uses the fast lane only.
        run: |
          mutmut run \
            --paths-to-mutate src/yt_uniquifier/core/ \
            --tests-dir tests/unit/ \
            --runner 'pytest -x -q -m "not integration and not visual"' \
            || true   # mutmut exits nonzero when survivors exist; we
                     #  inspect the kill rate below
      - name: Compute kill rate and gate at 40%
        # ``mutmut results`` produces a small summary; we parse it for
        # the killed/total ratio.  A v1.2.0 floor of 40 % is a starting
        # ratchet — v1.3.0 raises this to 70 % per the roadmap.
        run: |
          python <<'PY'
          import re, subprocess, sys
          out = subprocess.check_output(["mutmut", "results"], text=True)
          killed = sum(int(m.group(1)) for m in re.finditer(r"(\d+) killed", out))
          survived = sum(int(m.group(1)) for m in re.finditer(r"(\d+) survived", out))
          total = killed + survived
          if total == 0:
              print("No mutations recorded — likely an environment issue")
              sys.exit(0)
          rate = 100.0 * killed / total
          print(f"Mutation kill rate: {killed}/{total} = {rate:.1f}%")
          if rate < 40.0:
              print("Below v1.2.0 floor (40%) — fail the workflow")
              sys.exit(1)
          PY
